apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels:
    app.kubernetes.io/name: unidealltu
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>UnidealLtu - {{ .Values.environment }}</title>
      </head>
      <body>
        <h1>UnidealLtu: {{ .Values.environment | upper }}</h1>
        <p>Argo CD and Helm successfully deployed this environment.</p>
        <p>This page is a temporary Nginx placeholder, not the React application.</p>
      </body>
    </html>
