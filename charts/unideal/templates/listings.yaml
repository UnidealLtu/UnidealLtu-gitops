
{{- if .Values.listings.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-listings

spec:
  replicas: {{ .Values.listings.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}-listings

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-listings

    spec:
      containers:
        - name: listings
          image: "{{ .Values.listings.image.repository }}:{{ .Values.listings.image.tag }}"
          imagePullPolicy: {{ .Values.listings.image.pullPolicy }}

          ports:
            - containerPort: 8000

          env:
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgres"

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: password

          readinessProbe:
            httpGet:
              path: /api/listings
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-listings

spec:
  type: ClusterIP

  selector:
    app: {{ .Release.Name }}-listings

  ports:
    - port: 8000
      targetPort: 8000

{{- end }}
