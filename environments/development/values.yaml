# Development Environment Configuration

app:
  name: unideal

replicaCount: 1

environment: Development

domain: unideal-dev.group-6-m7011e-ltu.se
email: jonmuh-3@student.se

image:
  repository: ghcr.io/unidealltu/unideal-frontend
  tag: "v1"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  certIssuer: letsencrypt-staging

# PostgreSQL database
postgres:
  enabled: true
  image: postgres:17-alpine
  database: unideal_listings
  user: unideal_dev
  secretName: unideal-dev-postgres
  storageClass: local-path
  storage: 1Gi
  appArmorUnconfined: true

# FastAPI Listings Service
listings:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/unidealltu/unideal-listings-service
    tag: latest
    pullPolicy: Always