apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unideal-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Unideal/Unideal-gitops.git
    targetRevision: main
    path: charts/unideal
    helm:
      releaseName: unideal-staging
      valueFiles:
        - ../../environments/staging/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: unideal-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
