apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unideal-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Unideal/Unideal-gitops.git
    targetRevision: main
    path: charts/unideal
    helm:
      releaseName: unideal-dev
      valueFiles:
        - ../../environments/development/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: unideal-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
