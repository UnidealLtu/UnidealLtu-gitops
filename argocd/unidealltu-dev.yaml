apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unidealltu-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/UnidealLtu/UnidealLtu-gitops.git
    targetRevision: main
    path: charts/unidealltu
    helm:
      releaseName: unidealltu-dev
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: unidealltu-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
