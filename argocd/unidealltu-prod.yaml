apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unideal-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Unideal/Unideal-gitops.git
    targetRevision: main
    path: charts/unideal
    helm:
      releaseName: unideal-prod
      valueFiles:
        - ../../environments/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: unideal-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
